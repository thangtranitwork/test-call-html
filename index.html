<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bship Voice Call Test Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .btn-call { background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%); }
        .btn-hangup { background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); }
        .btn-action { background: rgba(51, 65, 85, 1); transition: all 0.2s; }
        .btn-action:hover { background: rgba(71, 85, 105, 1); transform: translateY(-2px); }
        .log-item { border-left: 3px solid #3b82f6; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Left: Config & Control -->
        <div class="lg:col-span-1 space-y-6">
            <div class="glass rounded-3xl p-6 shadow-2xl">
                <h1 class="text-2xl font-bold mb-6 flex items-center gap-2">
                    <span class="p-2 bg-blue-600 rounded-lg">📞</span>
                    Voice Call Tester
                </h1>

                <div class="space-y-4">
                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">WebSocket URL</label>
                        <input id="wsUrl" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:border-blue-500" value="ws://localhost:8081/gs-guide-websocket/websocket">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Vai Trò</label>
                            <select id="role" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:border-blue-500">
                                <option value="user">Khách Hàng (User)</option>
                                <option value="driver">Tài Xế (Driver)</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Số Điện Thoại</label>
                            <input id="phone" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:border-blue-500" placeholder="0367...">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Access Token</label>
                        <input id="token" type="text" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:border-blue-500" placeholder="Token...">
                    </div>

                    <div>
                        <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Go ID (Trip ID)</label>
                        <input id="goId" type="number" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2 mt-1 focus:outline-none focus:border-blue-500" placeholder="1539...">
                    </div>

                    <button id="btnConnect" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold transition-all shadow-lg shadow-blue-900/20">
                        KẾT NỐI
                    </button>
                    <button id="btnDisconnect" class="w-full py-3 bg-slate-800 hover:bg-slate-700 rounded-xl font-bold transition-all hidden">
                        NGẮT KẾT NỐI
                    </button>
                </div>
            </div>

            <!-- Call Controls -->
            <div id="callControls" class="glass rounded-3xl p-6 shadow-2xl opacity-50 pointer-events-none transition-all">
                <h2 class="text-lg font-bold mb-4 flex items-center gap-2">
                    <span class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></span>
                    Điều Khiển Cuộc Gọi
                </h2>
                
                <div class="grid grid-cols-2 gap-4">
                    <button id="btnCall" class="btn-call col-span-2 py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl shadow-green-900/20">
                        <span>🚀</span> THỰC HIỆN GỌI
                    </button>
                    <button id="btnAnswer" class="btn-action py-3 rounded-xl text-green-400 font-semibold border border-green-900/30">
                        NHẬN CUỘC GỌI
                    </button>
                    <button id="btnReject" class="btn-action py-3 rounded-xl text-red-400 font-semibold border border-red-900/30">
                        TỪ CHỐI
                    </button>
                    <button id="btnIce" class="btn-action py-3 rounded-xl text-blue-400 font-semibold border border-blue-900/30">
                        GỬI ICE
                    </button>
                    <button id="btnHangup" class="btn-hangup py-3 rounded-xl font-bold shadow-xl shadow-red-900/20">
                        CÚP MÁY
                    </button>
                </div>
                
                <div id="callStatus" class="mt-6 p-4 bg-slate-900/50 rounded-2xl text-center text-sm font-medium text-slate-400">
                    Chờ cuộc gọi...
                </div>
            </div>
        </div>

        <!-- Right: Logs -->
        <div class="lg:col-span-2 flex flex-col h-[calc(100vh-4rem)]">
            <div class="glass rounded-3xl p-6 shadow-2xl flex-1 flex flex-col overflow-hidden">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold flex items-center gap-2">
                        📜 Nhật Ký Hoạt Động
                    </h2>
                    <button onclick="clearLogs()" class="text-xs text-slate-400 hover:text-white underline">Xoá logs</button>
                </div>
                
                <div id="logContainer" class="flex-1 overflow-y-auto space-y-3 pr-2">
                    <!-- Logs injection -->
                    <div class="log-item p-3 bg-slate-800/40 rounded-xl text-sm">
                        <span class="text-slate-500">[SYSTEM]</span> Sẵn sàng test. Vui lòng nhập thông tin và nhấn Kết nối.
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- Incoming Call Modal -->
    <div id="incomingModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm hidden items-center justify-center z-50">
        <div class="glass w-full max-w-sm rounded-[2.5rem] p-8 text-center animate-bounce-short">
            <div class="w-24 h-24 bg-green-500/20 rounded-full mx-auto flex items-center justify-center mb-6">
                <span class="text-4xl">📞</span>
            </div>
            <h3 class="text-2xl font-bold mb-2" id="incomingName">Người gọi ẩn danh</h3>
            <p class="text-slate-400 mb-8" id="incomingPhone">Đang gọi cho bạn...</p>
            
            <div class="flex gap-4">
                <button id="modalReject" class="flex-1 py-4 bg-red-500 rounded-2xl font-bold shadow-lg shadow-red-900/40">TỪ CHỐI</button>
                <button id="modalAnswer" class="flex-1 py-4 bg-green-500 rounded-2xl font-bold shadow-lg shadow-green-900/40 animate-pulse">NHẬN</button>
            </div>
        </div>
    </div>

    <!-- Audio Elements -->
    <audio id="localAudio" autoplay muted></audio>
    <audio id="remoteAudio" autoplay></audio>

    <script>
        let client = null;
        let activeCallId = null;
        let peerConnection = null;
        let localStream = null;

        const logContainer = document.getElementById('logContainer');

        const configuration = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // URL Params Handling
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('token')) document.getElementById('token').value = urlParams.get('token');
        if (urlParams.get('goId')) document.getElementById('goId').value = urlParams.get('goId');
        if (urlParams.get('role')) document.getElementById('role').value = urlParams.get('role');
        if (urlParams.get('phone')) document.getElementById('phone').value = urlParams.get('phone');

        function addLog(type, msg, data = null) {
            const item = document.createElement('div');
            item.className = 'log-item p-3 bg-slate-800/40 rounded-xl text-sm';
            
            let color = 'text-blue-400';
            if (type === 'SEND') color = 'text-purple-400';
            if (type === 'RECV') color = 'text-green-400';
            if (type === 'ERROR') color = 'text-red-400';

            item.innerHTML = `
                <div class="flex justify-between items-start">
                    <span class="${color} font-bold">[${type}] ${new Date().toLocaleTimeString()}</span>
                </div>
                <div class="mt-1">${msg}</div>
                ${data ? `<pre class="mt-2 p-2 bg-black/50 rounded-lg text-xs overflow-x-auto text-slate-300 font-mono">${JSON.stringify(data, null, 2)}</pre>` : ''}
            `;
            logContainer.prepend(item);
        }

        async function initWebRTC() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('localAudio').srcObject = localStream;
                addLog('SYSTEM', 'Đã truy cập Micro thành công.');
            } catch (e) {
                addLog('ERROR', 'Không thể truy cập Micro: ' + e.message);
            }
        }

        function createPeerConnection(goId, callId) {
            peerConnection = new RTCPeerConnection(configuration);
            
            // Add local stream
            if (localStream) {
                localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));
            }

            // Handle remote stream
            peerConnection.ontrack = (event) => {
                document.getElementById('remoteAudio').srcObject = event.streams[0];
                addLog('SYSTEM', 'Đã nhận được luồng âm thanh từ bên kia! 🎙️');
            };

            // Handle ICE Candidates
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    sendPayload('/app/doCallIce', {
                        goID: goId,
                        callId: callId,
                        candidate: JSON.stringify(event.candidate)
                    });
                }
            };

            peerConnection.onconnectionstatechange = () => {
                addLog('SYSTEM', 'WebRTC State: ' + peerConnection.connectionState);
            };
        }

        function clearLogs() { logContainer.innerHTML = ''; }

        document.getElementById('btnConnect').onclick = () => {
            const wsUrl = document.getElementById('wsUrl').value;
            const phone = document.getElementById('phone').value;
            const role = document.getElementById('role').value;
            const token = document.getElementById('token').value;

            if (!phone || !token) return alert('Thiếu SĐT hoặc Token!');

            addLog('SYSTEM', 'Đang thử kết nối tới: ' + wsUrl);

            client = new StompJs.Client({
                webSocketFactory: () => new WebSocket(wsUrl),
                reconnectDelay: 0, 
                debug: function (str) { console.log(str); },
                onConnect: (frame) => {
                    addLog('SYSTEM', 'Đã kết nối STOMP thành công.');
                    document.getElementById('btnConnect').classList.add('hidden');
                    document.getElementById('btnDisconnect').classList.remove('hidden');
                    document.getElementById('callControls').classList.remove('opacity-50', 'pointer-events-none');
                    
                    const userTypeStr = role === 'user' ? 'user' : 'driver';
                    const events = ['onAuthen', 'onCallOffer', 'onCallAnswer', 'onCallIce', 'onCallReject', 'onCallHangup', 'onCallBusy', 'onCallOffline', 'onCallMissed'];
                    
                    events.forEach(ev => {
                        const dest = `/${userTypeStr}/${phone}/${ev}`;
                        client.subscribe(dest, (msg) => {
                            const body = JSON.parse(msg.body);
                            addLog('RECV', `Event: ${ev}`, body);
                            handleIncomingEvent(ev, body);
                        });
                    });

                    sendPayload('/app/doAuthen', { accessToken: token, type: role === 'user' ? '1' : '2' });
                    initWebRTC();
                },
                onStompError: (frame) => { addLog('ERROR', 'STOMP Protocol Error: ' + frame.headers['message']); },
                onWebSocketClose: () => { addLog('SYSTEM', 'Kết nối WebSocket đã đóng.'); resetUI(); }
            });

            client.activate();
        };

        document.getElementById('btnDisconnect').onclick = () => { if (client) client.deactivate(); };

        function sendPayload(dest, body) {
            if (!client || !client.connected) return;
            client.publish({ destination: dest, body: JSON.stringify(body) });
            addLog('SEND', `Destination: ${dest}`, body);
        }

        async function handleIncomingEvent(ev, body) {
            const statusEl = document.getElementById('callStatus');
            const goId = parseInt(document.getElementById('goId').value);

            if (ev === 'onCallOffer') {
                activeCallId = body.callId;
                document.getElementById('incomingName').innerText = body.callerPhone;
                document.getElementById('incomingModal').classList.remove('hidden');
                document.getElementById('incomingModal').classList.add('flex');
                statusEl.innerText = "🛎 Đang đổ chuông...";
                
                // Chuẩn bị PeerConnection nhưng chưa answer
                createPeerConnection(goId, activeCallId);
                try {
                    const desc = new RTCSessionDescription({ type: 'offer', sdp: body.sdp });
                    await peerConnection.setRemoteDescription(desc);
                } catch (e) {
                    addLog('ERROR', 'setRemoteDescription failed: ' + e.message);
                }
            }
            if (ev === 'onCallAnswer') {
                statusEl.innerText = "📞 Đã kết nối";
                statusEl.classList.add('text-green-400');
                try {
                    const desc = new RTCSessionDescription({ type: 'answer', sdp: body.sdp });
                    await peerConnection.setRemoteDescription(desc);
                } catch (e) {
                    addLog('ERROR', 'setRemoteDescription (answer) failed: ' + e.message);
                }
            }
            if (ev === 'onCallIce') {
                if (peerConnection && body.candidate) {
                    const candidate = new RTCIceCandidate(JSON.parse(body.candidate));
                    await peerConnection.addIceCandidate(candidate);
                }
            }
            if (ev === 'onCallHangup' || ev === 'onCallReject' || ev === 'onCallMissed') {
                statusEl.innerText = "🔚 Cuộc gọi kết thúc (" + ev + ")";
                statusEl.classList.remove('text-green-400');
                document.getElementById('incomingModal').classList.add('hidden');
                if (peerConnection) peerConnection.close();
                peerConnection = null;
                activeCallId = null;
            }
        }

        // Call Actions
        document.getElementById('btnCall').onclick = async () => {
            const goId = parseInt(document.getElementById('goId').value);
            activeCallId = "call_" + Date.now();
            
            createPeerConnection(goId, activeCallId);
            try {
                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                sendPayload('/app/doCallOffer', {
                    goID: goId,
                    callId: activeCallId,
                    sdp: offer.sdp
                });
                document.getElementById('callStatus').innerText = "📤 Đang gọi...";
            } catch (e) {
                addLog('ERROR', 'Lỗi tạo Offer: ' + e.message);
            }
        };

        document.getElementById('btnAnswer').onclick = () => answerCall();
        document.getElementById('modalAnswer').onclick = () => answerCall();
        
        async function answerCall() {
            if (!peerConnection) {
                addLog('ERROR', 'Lỗi: Không có kết nối cuộc gọi hiện tại.');
                return;
            }
            if (peerConnection.signalingState !== 'have-remote-offer') {
                addLog('ERROR', 'Lỗi: Trạng thái không hợp lệ để trả lời (' + peerConnection.signalingState + ').');
                return;
            }
            
            const goId = parseInt(document.getElementById('goId').value);
            try {
                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                sendPayload('/app/doCallAnswer', {
                    goID: goId,
                    callId: activeCallId,
                    sdp: answer.sdp
                });
                document.getElementById('incomingModal').classList.add('hidden');
                document.getElementById('callStatus').innerText = "📞 Đã kết nối";
                document.getElementById('callStatus').classList.add('text-green-400');
            } catch (e) {
                addLog('ERROR', 'Lỗi tạo Answer: ' + e.message);
            }
        }

        document.getElementById('btnReject').onclick = () => rejectCall();
        document.getElementById('modalReject').onclick = () => rejectCall();

        function rejectCall() {
            const goId = parseInt(document.getElementById('goId').value);
            sendPayload('/app/doCallReject', { goID: goId, callId: activeCallId, reason: "User rejected" });
            document.getElementById('incomingModal').classList.add('hidden');
        }

        document.getElementById('btnHangup').onclick = () => {
            const goId = parseInt(document.getElementById('goId').value);
            sendPayload('/app/doCallHangup', { goID: goId, callId: activeCallId });
        };

        function resetUI() {
            document.getElementById('btnConnect').classList.remove('hidden');
            document.getElementById('btnDisconnect').classList.add('hidden');
            document.getElementById('callControls').classList.add('opacity-50', 'pointer-events-none');
            document.getElementById('callStatus').innerText = "Chờ kết nối...";
        }
    </script>
</body>
</html>
</body>
</html>
